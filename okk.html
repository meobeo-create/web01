<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Danh Sách Người Dùng</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 30px;
      background-color: #f8f9fa;
    }

    h2 {
      color: #333;
    }

    /* Định dạng bảng */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background-color: #ffffff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
    }

    th {
      background-color: #007bff;
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 14px;
    }

    /* Hiệu ứng dòng xen kẽ và di chuột */
    tbody tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    tbody tr:hover {
      background-color: #e9ecef;
    }

    td {
      border-bottom: 1px solid #dddddd;
      color: #555;
    }

    .loading {
      text-align: center;
      font-style: italic;
      color: #666;
    }
  </style>
</head>
<body>

  <h2>Danh sách người dùng</h2>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Tên</th>
        <th>Email</th>
        <th>Địa chỉ</th>
        <th>Công ty</th>
      </tr>
    </thead>
    <tbody id="user-table-body">
      <tr>
        <td colspan="5" class="loading">Đang tải dữ liệu...</td>
      </tr>
    </tbody>
  </table>

  <script>
    async function loadUserData() {
      const tableBody = document.getElementById("user-table-body");

      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/users");
        const users = await response.json();

        // Xóa dòng "Đang tải dữ liệu..."
        tableBody.innerHTML = "";

        // Duyệt qua danh sách users để tạo từng dòng (row)
        users.forEach(user => {
          const row = document.createElement("tr");

          // Định dạng địa chỉ thành chuỗi gọn gàng
          const address = `${user.address.suite}, ${user.address.street}, ${user.address.city}`;

          row.innerHTML = `
            <td>${user.id}</td>
            <td><strong>${user.name}</strong></td>
            <td>${user.email}</td>
            <td>${address}</td>
            <td>${user.company.name}</td>
          `;

          tableBody.appendChild(row);
        });

      } catch (error) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="5" style="color: red; text-align: center;">Có lỗi xảy ra khi tải dữ liệu!</td>
          </tr>
        `;
        console.error("Lỗi:", error);
      }
    }

    // Gọi hàm nạp dữ liệu
    loadUserData();
  </script>

</body>
</html>
